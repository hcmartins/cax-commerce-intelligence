name: commerce-intelligence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_commerce}
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_commerce} -d ${POSTGRES_DB:-ai_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env file's DATABASE_URL, which points at "localhost" for
      # running the app directly on the host. Inside this compose network, Postgres
      # is reachable at the "db" service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_commerce}:${POSTGRES_PASSWORD:-ai_commerce}@db:5432/${POSTGRES_DB:-ai_commerce}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      # /ready (not /health): checks the database is actually reachable, since
      # that's what the "ui" service below waits on before it starts sending it
      # traffic. /health is liveness-only by design — see app/api/system.py.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_HOST_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
