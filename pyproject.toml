[project]
name = "commerce-intelligence"
version = "0.1.0"
description = "Commerce Intelligence — what should I sell, where should I buy it, and will it make money?"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "anthropic>=0.30.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
ui = [
    "streamlit>=1.37.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable Postgres test database (see tests/conftest.py)",
    "smoke: exercises a running deployment over real HTTP (see tests/smoke/test_smoke.py)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Explicit, not left to ruff's version-dependent default — CI resolved a
# broader rule set (BLE001, I001, ...) than this project has ever been
# written against, purely from an unpinned `ruff>=0.5.0` picking up whatever
# the latest ruff considers default. Pinning the selection here makes local
# and CI runs identical regardless of which ruff version either resolves.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
